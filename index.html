<!DOCTYPE html>
<html>
<head>
  <title>Happy AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #050505;
      color: #00e5ff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      font-size: 55px;
      letter-spacing: 8px;
    }

    button {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: none;
      background: #00e5ff;
      color: #050505;
      font-size: 20px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    #output {
      margin: 40px 20px;
      font-size: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <h1>HAPPY</h1>

  <button id="talkButton" onclick="talk()">🎤 TALK</button>

  <div id="output">
    Tap the button and talk to Happy
  </div>

  <script>

    async function talk() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        document.getElementById("output").innerText =
          "Voice recognition is not supported.";
        return;
      }

      const button = document.getElementById("talkButton");
      const output = document.getElementById("output");

      const recognition = new SpeechRecognition();

      recognition.lang = "en-IN";
      recognition.interimResults = false;
      recognition.continuous = false;

      button.disabled = true;
      output.innerText = "🎤 Listening...";

      recognition.start();

      recognition.onresult = async function(event) {

        const text =
          event.results[0][0].transcript;
const command = text.toLowerCase().trim();
if (
  command.startsWith("search ") &&
  command.includes(" in youtube")
) {
  const searchText = command
    .replace(/^search\s+/i, "")
    .replace(/\s+in youtube$/i, "")
    .trim();

  if (searchText) {
    output.innerText = "🔎 Searching YouTube...";
    window.location.href =
      "https://www.youtube.com/results?search_query=" +
      encodeURIComponent(searchText);
    return;
  }
}

     if (command.startsWith("search google for ")) {
  const searchText = command.replace("search google for ", "").trim();

  if (searchText) {
    output.innerText = "🔎 Searching Google...";
    window.location.href =
      "https://www.google.com/search?q=" + encodeURIComponent(searchText);
    return;
  }
     }   if (
  command === "open google" ||
  command === "open google.com"
) {
  output.innerText = "🌐 Opening Google...";
  window.location.href = "https://www.google.com/";
  return;
     }if (
  command === "open gmail" ||
  command === "open gmail.com"
) {
  output.innerText = "📧 Opening Gmail...";
  window.location.href = "https://mail.google.com/";
  return;
     }if (
  command === "open whatsapp" ||
  command === "open whats app"
) {
  output.innerText = "💬 Opening WhatsApp...";
  window.location.href = "https://web.whatsapp.com/";
  return;
     }if (
  command === "open instagram" ||
  command === "open insta"
) {
  output.innerText = "📸 Opening Instagram...";
  window.location.href = "https://www.instagram.com/";
  return;
     }
        output.innerText =
          "You: " + text + "\n\n⏳ Happy is thinking...";

        try {

          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: text
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "AI request failed");
          }

          const answer = data.answer;

          output.innerText =
            "You: " + text + "\n\nHappy: " + answer;

          const voice =
            new SpeechSynthesisUtterance(answer);

          voice.lang = "en-IN";
          voice.rate = 1;
          voice.pitch = 1;

          speechSynthesis.cancel();
          speechSynthesis.speak(voice);

        } catch (error) {

          console.error(error);

          output.innerText =
            "Sorry, Happy couldn't connect to the AI.\n\n" +
            error.message;
        }

        button.disabled = false;
      };

      recognition.onerror = function(event) {

        console.error(event);

        output.innerText =
          "Sorry, I couldn't hear you.";

        button.disabled = false;
      };

      recognition.onend = function() {
        button.disabled = false;
      };
    }

  </script>

</body>
</html>
